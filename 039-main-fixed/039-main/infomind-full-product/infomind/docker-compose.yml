services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: infomind, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-infomind}", POSTGRES_DB: infomind }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U infomind"], interval: 3s, retries: 20 }
  backend:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql+psycopg2://infomind:${POSTGRES_PASSWORD:-infomind}@db/infomind"
      INFOMIND_SECRET: "${INFOMIND_SECRET:-dev-secret-change-me}"
      INFOMIND_DEMO_PASSWORD: "${INFOMIND_DEMO_PASSWORD:-demo1234}"
      INFOMIND_SEED_DEMO: "${INFOMIND_SEED_DEMO:-1}"
      CORS_ORIGINS: "http://localhost:8080"
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  pgdata:
